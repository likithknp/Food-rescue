# Brevo Mail Configuration
mail.enabled=true

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587

spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Increase connection/write/read timeouts for SMTP (milliseconds). The default may be low
# which causes SocketTimeoutException when the SMTP server is slow or network is restricted.
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# Enable JavaMail debug to get more verbose SMTP logs in the application output (helpful when diagnosing connection/auth problems)
spring.mail.properties.mail.debug=true

# Optional: let Spring Boot attempt a test connection on startup (can help detect problems early)
# spring.mail.test-connection=true
# Sender email
spring.mail.properties.from=foodrescue.notifications@gmail.com

